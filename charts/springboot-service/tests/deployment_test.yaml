# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test deployment
release:
  name: unittest
  namespace: na
chart:
  version: 9.9.9+test
set:
  nameOverride: test-service
  image:
    repository: "scoolee/test-service"
    tag: "0.1.1"
tests:
  - it: should render deployment with overriden values
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - isType:
          path: metadata.name
          type: string
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.restartPolicy
          value: Always
      - equal:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].image
          value: "ghcr.io/scoolee/test-service:0.1.1"
      - equal:
          path: metadata.labels['helm.sh/chart']
          value: springboot-service-9.9.9_test
      - contains:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].ports
          content:
            containerPort: 8080
            name: http
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].ports
          content:
            containerPort: 9090
            name: http-management
            protocol: TCP
      - notContains:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].ports
          content:
            containerPort: 80
      - notExists:
          path: spec.template.nodeSelector
      - notExists:
          path: spec.template.spec.containers[1]
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - notLengthEqual:
          path: spec.template.spec.containers
          count: 10
      - contains:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].env
          content:
            name: LOG4J_CONFIGURATION_FILE
            value: /etc/config/app/log4j.yaml
      - contains:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].env
          content:
            name: JAVA_TOOL_OPTIONS
            value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=80.0 -Djava.security.egd=file:/dev/./urandom -Djava.net.preferIPv4Stack=true -Djava.awt.headless=true -Dspring.config.additional-location=/etc/config/app/application.yaml
      - equal:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].livenessProbe
          value:
            httpGet:
              path: /actuator/health/liveness
              port: http-management
            failureThreshold: 3
            periodSeconds: 15
      - equal:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].readinessProbe
          value:
            httpGet:
              path: /actuator/health/readiness
              port: http-management
            failureThreshold: 10
            periodSeconds: 15
      - equal:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].startupProbe
          value:
            httpGet:
              path: /actuator/health/readiness
              port: http-management
            failureThreshold: 10
            initialDelaySeconds: 15
            periodSeconds: 15
      - equal:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].resources.limits.cpu
          value: "100m"
      - equal:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].resources.requests.cpu
          value: "100m"
      - equal:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].resources.requests.memory
          value: "128Mi"
      - equal:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].resources.limits.memory
          value: "512Mi"
      - contains:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].volumeMounts
          content:
            name: unittest-test-service
            mountPath: /etc/config/app
      - contains:
          path: spec.template.spec.containers[?(@.name == "springboot-service")].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: unittest-test-service
            configMap:
              name: unittest-test-service
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}
      - equal:
          path: spec.template.spec.serviceAccountName
          value: unittest-test-service
